<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Network test</title>
<style>
:root{--ink:#1f2937; --soft:#4b5563; --bg:#f6f8f9; --card:#fff; --good:#059669; --good-bg:#ecfdf5; --bad:#dc2626; --bad-bg:#fef2f2; --wait:#6b7280; --teach:#6d28d9}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px; margin:0 auto; padding:24px 16px 48px}
h1{font-size:1.6em; margin:0 0 4px}
p.lead{color:var(--soft); margin:0 0 20px}
.verdict{border-radius:14px; padding:18px 20px; margin:0 0 20px; font-weight:700; font-size:1.15em; background:#e5e7eb}
.verdict.good{background:var(--good-bg); color:var(--good); border:2px solid var(--good)}
.verdict.bad{background:var(--bad-bg); color:var(--bad); border:2px solid var(--bad)}
ul.tests{list-style:none; padding:0; margin:0 0 20px}
ul.tests li{background:var(--card); border-radius:10px; padding:12px 16px; margin:0 0 10px; display:flex; gap:12px; align-items:flex-start; box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dot{flex:0 0 28px; height:28px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; background:var(--wait)}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)}
.t-name{font-weight:700}
.t-msg{color:var(--soft); font-size:.9em}
.info{font-size:.85em; color:var(--soft); background:var(--card); border-radius:10px; padding:12px 16px}
button{font:inherit; font-weight:700; border:0; border-radius:24px; padding:10px 20px; background:var(--teach); color:#fff; cursor:pointer; min-height:44px}
</style>
</head>
<body>
<main>
  <h1>Network test</h1>
  <p class="lead">This page checks if this network lets lesson pages talk to Google Firebase. It takes about 10 seconds. Nothing is saved.</p>

  <div class="verdict" id="verdict">Testing...</div>

  <ul class="tests" id="tests"></ul>

  <p><button type="button" id="again">Run the test again</button></p>

  <div class="info" id="info"></div>
</main>

<script>
(function(){
  var DB = 'https://hacker-news.firebaseio.com';
  var TESTS = [
    { id:'read',  name:'1. Read from Firebase',        run: testRead },
    { id:'live',  name:'2. Live updates (stream)',     run: testStream },
    { id:'ws',    name:'3. Live connection (socket)',  run: testSocket },
    { id:'sdk',   name:'4. Firebase code library',     run: testSdk }
  ];

  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('No answer after ' + ms/1000 + ' seconds')); }, ms); })]);
  }

  function testRead(){
    return fetch(DB + '/v0/maxitem.json', { cache:'no-store' }).then(function(r){
      if(!r.ok) throw new Error('Blocked or failed (code ' + r.status + ')');
      return r.json();
    }).then(function(n){ return 'Got an answer (' + n + ')'; });
  }

  function testStream(){
    return new Promise(function(res, rej){
      if(!window.EventSource){ rej(new Error('This browser has no EventSource')); return; }
      var es = new EventSource(DB + '/v0/maxitem.json');
      es.addEventListener('put', function(){ es.close(); res('Live stream works'); });
      es.onerror = function(){ es.close(); rej(new Error('Stream was blocked')); };
    });
  }

  function testSocket(){
    return new Promise(function(res, rej){
      var ws;
      try{ ws = new WebSocket('wss://hacker-news.firebaseio.com/.ws?v=5&ns=hacker-news'); }
      catch(e){ rej(new Error('Socket could not start')); return; }
      ws.onmessage = function(){ ws.close(); res('Socket connection works'); };
      ws.onerror = function(){ rej(new Error('Socket was blocked')); };
    });
  }

  function testSdk(){
    return new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js?t=' + Date.now();
      s.onload = function(){ res('Library loaded'); };
      s.onerror = function(){ rej(new Error('Library was blocked')); };
      document.head.appendChild(s);
    });
  }

  function runAll(){
    var list = document.getElementById('tests'), verdict = document.getElementById('verdict');
    verdict.className = 'verdict'; verdict.textContent = 'Testing...';
    list.innerHTML = '';
    var jobs = TESTS.map(function(t){
      var li = document.createElement('li');
      li.innerHTML = '<span class="dot">…</span><div><div class="t-name"></div><div class="t-msg">Checking...</div></div>';
      li.querySelector('.t-name').textContent = t.name;
      list.appendChild(li);
      var dot = li.querySelector('.dot'), msg = li.querySelector('.t-msg');
      return withTimeout(Promise.resolve().then(t.run), 10000).then(function(m){
        dot.className = 'dot good'; dot.textContent = '✓'; msg.textContent = m; return true;
      }, function(e){
        dot.className = 'dot bad'; dot.textContent = '✕'; msg.textContent = e.message; return false;
      });
    });
    Promise.all(jobs).then(function(r){
      var passed = r.filter(Boolean).length;
      var main = r[0] && (r[1] || r[2]);
      if(passed === r.length){ verdict.className = 'verdict good'; verdict.textContent = 'All 4 tests passed. Firebase works on this network.'; }
      else if(main){ verdict.className = 'verdict good'; verdict.textContent = passed + ' of 4 passed. Firebase should still work here. Tell Claude which ones failed.'; }
      else { verdict.className = 'verdict bad'; verdict.textContent = passed + ' of 4 passed. Firebase is blocked on this network.'; }
    });
  }

  var inFrame = false; try{ inFrame = window.self !== window.top; }catch(e){ inFrame = true; }
  document.getElementById('info').textContent =
    'Opened ' + (inFrame ? 'inside another page (for example Nearpod)' : 'on its own') +
    ' · ' + new Date().toLocaleString('en-AU') +
    ' · Browser: ' + (navigator.userAgentData && navigator.userAgentData.brands ? navigator.userAgentData.brands.map(function(b){return b.brand;}).filter(function(b){return !/Not/.test(b);}).join(', ') : navigator.userAgent);

  document.getElementById('again').addEventListener('click', runAll);
  runAll();
})();
</script>
</body>
</html>
