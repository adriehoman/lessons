function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"")}
function open(code){var p=P.split("."),salt=b64(p[0]),iv=b64(p[1]),data=b64(p[2]);

 .then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:N,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])})
 .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,data)})
 .then(function(buf){return new TextDecoder().decode(buf)})}
